# 单张 RTX 5090（32 GB）上的 Flow-GRPO mini baseline。
# 固定种子抽取 20 条训练样本（mathhard/nq 各 10），用于验证非零 reward variance 与真实 GRPO 更新。
env:
  CUDA_VISIBLE_DEVICES: '0'
  HYDRA_FULL_ERROR: 1
  N_GPUS: 1
  BASE_MODEL: '/root/autodl-tmp/models/Qwen2.5-3B-Instruct'
  ROLLOUT_TP_SIZE: 1
  # vLLM 0.9.2 的异步引擎需明确启用 V1 实现。
  VLLM_USE_V1: 1
  EXPERIMENT_NAME: 'qwen25-3b-lora-mini20-seed20260825'
  PROJECT_NAME: 'agentflow-mini-baseline'
  BASE_DATA_DIR: '/root/autodl-tmp/AgentFlow/data'
  VERBOSITY: 'INFO'
  N_WORKERS: 1
  ENABLE_TOOLS: ['Base_Generator_Tool']
  TOOL_ENGINE: ['deepseek-v4-flash']
  MODEL_ENGINE: ['trainable', 'deepseek-v4-flash', 'deepseek-v4-flash', 'deepseek-v4-flash']
  TOOL_STEPS: 2
  TEST_TEMPERATURE: 0.0
  TRAIN_TEMPERATURE: 0.7
  OUTPUT_TYPE: 'direct'
  AGENT_MAX_TIMEOUT: 180

python_args:
  agentflow.port: 9999
  algorithm.adv_estimator: 'grpo'
  algorithm.use_kl_in_reward: False
  data.train_files: '${BASE_DATA_DIR}/train/flowgrpo_mini_20_seed20260825.parquet'
  data.val_files: '${BASE_DATA_DIR}/val/aime24.parquet'
  data.train_batch_size: 2
  data.max_prompt_length: 1280
  data.max_response_length: 384
  data.truncation: 'truncate'
  actor_rollout_ref.model.path: '${BASE_MODEL}'
  actor_rollout_ref.model.lora_rank: 8
  actor_rollout_ref.model.lora_alpha: 16
  actor_rollout_ref.model.target_modules: 'all-linear'
  actor_rollout_ref.model.use_remove_padding: True
  actor_rollout_ref.model.enable_gradient_checkpointing: True
  actor_rollout_ref.actor.optim.lr: 1e-5
  actor_rollout_ref.actor.ppo_mini_batch_size: 2
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1
  actor_rollout_ref.actor.use_kl_loss: False
  actor_rollout_ref.actor.entropy_coeff: 0.0
  # 训练器与 rollout 共用一张 32 GB 卡；offload 为单卡冒烟保留显存峰值。
  actor_rollout_ref.actor.fsdp_config.param_offload: True
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: True
  # 采用 FSDP2 初始化路径以避免旧 FSDP 在 world_size=1 时停滞。
  actor_rollout_ref.actor.strategy: 'fsdp2'
  actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu: 1
  actor_rollout_ref.ref.fsdp_config.param_offload: True
  actor_rollout_ref.rollout.name: 'vllm'
  actor_rollout_ref.rollout.tensor_model_parallel_size: '${ROLLOUT_TP_SIZE}'
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 1
  actor_rollout_ref.rollout.n: 2
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.24
  actor_rollout_ref.rollout.max_model_len: 2048
  actor_rollout_ref.rollout.max_num_batched_tokens: 2048
  actor_rollout_ref.rollout.max_num_seqs: 2
  actor_rollout_ref.rollout.enable_chunked_prefill: True
  actor_rollout_ref.rollout.load_format: 'safetensors'
  actor_rollout_ref.rollout.multi_turn.format: 'hermes'
  trainer.critic_warmup: 0
  trainer.logger: ['console']
  trainer.project_name: '${PROJECT_NAME}'
  trainer.experiment_name: '${EXPERIMENT_NAME}'
  trainer.nnodes: 1
  trainer.n_gpus_per_node: '${N_GPUS}'
  trainer.val_before_train: False
  trainer.test_freq: 1000
  trainer.save_freq: 1000
  # Checkpoints are intentionally outside the 50 GB data disk. A full FSDP
  # state dict is about 9.5 GB even for LoRA and must not exhaust experiment
  # storage that holds source, logs, and rollout data.
  trainer.default_local_dir: '/root/agentflow-checkpoints/${PROJECT_NAME}/${EXPERIMENT_NAME}'
  trainer.total_epochs: 1
